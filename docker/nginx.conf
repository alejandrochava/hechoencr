events {}

http {
  # supabase-js espera un solo origen con /auth/v1 y /rest/v1 colgando de el.
  # En Supabase hosted eso lo hace Kong; aca alcanza con nginx.

  # Kong tambien pone los headers de CORS: sin ellos el navegador rechaza
  # las llamadas desde http://localhost:3000.
  map $http_origin $cors_origin {
    default "";
    "~^http://localhost(:\d+)?$" $http_origin;
  }

  server {
    listen 8000;

    location /auth/v1/ {
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept, accept-profile, content-profile, prefer, range" always;
      add_header Access-Control-Max-Age 3600 always;

      if ($request_method = OPTIONS) {
        return 204;
      }

      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept, accept-profile, content-profile, prefer, range" always;
      add_header Access-Control-Expose-Headers "content-range, content-profile" always;
      add_header Access-Control-Max-Age 3600 always;

      if ($request_method = OPTIONS) {
        return 204;
      }

      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      default_type application/json;
      return 404 '{"error":"ruta no manejada por el gateway local"}';
    }
  }
}
