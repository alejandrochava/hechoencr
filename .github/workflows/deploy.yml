name: Desplegar

# Solo la rama `produccion` publica, y solo si CI quedo verde.
on:
  push:
    branches: [produccion]

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

  desplegar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Desplegar a Vercel
        # Requiere los secrets VERCEL_TOKEN_HECHOENCR, VERCEL_ORG_ID y
        # VERCEL_PROJECT_ID en Settings > Secrets > Actions del repositorio.
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_HECHOENCR }}
        # Si el secret falta, `--token` se queda sin valor y el error que da
        # Vercel no dice cual es. Mejor fallar aca, diciendolo.
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Falta el secret VERCEL_TOKEN_HECHOENCR en el repositorio." >&2
            exit 1
          fi
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
